<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');:root{--bg:#0d1117;--green:#8EAAB8;--pink:#C84A3B;--cream:#F0F3F7;--serif:'DM Serif Display',Georgia,'Noto Serif SC',serif;--sans:'DM Sans',-apple-system,'PingFang SC',sans-serif;--mono:'JetBrains Mono','SF Mono',monospace;--amber:#E0A458}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;background:var(--bg)}.page{width:1920px;height:1080px;background:var(--bg);position:relative;overflow:hidden;font-family:var(--sans)}.colophon{display:none!important}.bg-svg{position:absolute;inset:0;z-index:1}.bg-svg .net-line{stroke:rgba(142,170,184,.12);stroke-width:1.5;fill:none}.bg-svg .net-dot{fill:rgba(240,243,247,.35)}.bg-svg .net-dot.pink{fill:var(--pink)}.bg-svg .net-dot.green{fill:var(--green)}.top-bar{position:absolute;top:50px;left:80px;right:80px;z-index:20;display:flex;justify-content:space-between;align-items:flex-start}.brand-wrap{flex:1}.brand{font:400 46px/1 var(--serif);color:var(--cream);letter-spacing:-.02em}.brand em{color:var(--pink);font-style:normal}.brand-sub{font:500 14px/1 var(--mono);color:var(--green);letter-spacing:.3em;text-transform:uppercase;margin-top:8px}.brand-mode{font:500 13px/1 var(--mono);color:var(--amber);letter-spacing:.4em;text-transform:uppercase;margin-top:14px;display:inline-block;background:rgba(224,164,88,.08);padding:7px 14px;border:1px solid rgba(224,164,88,.3);border-radius:3px}.top-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:780px;margin-top:6px}.tg{font:500 14px/1 var(--mono);padding:8px 14px;border-radius:4px;letter-spacing:.1em;text-transform:uppercase}.tg.hot{background:rgba(200,74,59,.12);border:1px solid rgba(200,74,59,.4);color:var(--pink)}.tg.norm{background:rgba(240,243,247,.05);border:1px solid rgba(240,243,247,.1);color:rgba(240,24 );color:var(--green);letter-spacing:.05em}.lb-lic{padding:3px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.1em}.lb-lic.ok{background:rgba(142,170,184,.12);color:var(--green);border:1px solid rgba(142,170,184,.3)}.lb-lic.warn{background:rgba(200,74,59,.12);color:var(--pink);border:1px solid rgba(200,74,59,.3)}.dim-strip{position:absolute;left:80px;top:820px;z-index:20;width:1760px}.dim-title{font:500 13px/1 var(--mono);color:var(--amber);letter-spacing:.4em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}.dim-title::after{content:"";flex:1;height:1px;background:rgba(224,164,88,.2)}.dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.dim-card{background:rgba(240,243,247,.04);border:1px solid rgba(240,243,247,.08);padding:18px 22px;border-radius:6px;min-height:90px}.dim-name{font:500 12px/1 var(--mono);color:var(--pink);letter-spacing:.3em;text-transform:uppercase;margin-bottom:12px}.dim-projects{display:flex;flex-direction:column;gap:5px;font:500 14px/1.3 var(--sans);color:rgba(240,243,247,.85)}.dim-projects em{color:var(--green);font-style:normal;font-weight:500;font-size:13px}.bottom-anchor{position:absolute;bottom:42px;left:80px;right:80px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid rgba(240,243,247,.1)}.ba-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ba-pill{font:500 12px/1.3 var(--mono);padding:7px 13px;background:rgba(240,243,247,.05);border:1px solid rgba(240,243,247,.1);border-radius:4px;color:rgba(240,243,247,.7);letter-spacing:.15em;text-transform:uppercase}.ba-pill.warm{background:rgba(142,170,184,.1);border-color:rgba(142,170,184,.3);color:var(--green)}.ba-pill.hot{background:rgba(200,74,59,.1);border-color:rgba(200,74,59,.3);color:var(--pink)}.ba-pill.gold{background:rgba(224,164,88,.1);border-color:rgba(224,164,88,.3);color:var(--amber)}.ba-url{font:500 17px/1 var(--mono);color:var(--green);letter-spacing:.1em}</style></head><body><div class="page"><svg class="bg-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#0d1117"/><g class="net-line"><path d="M100,180 L300,300 L520,200 L780,340"/><path d="M150,920 L380,820 L640,930 L900,820"/><path d="M1750,180 L1900,320"/><path d="M1780,940 L1920,820"/></g><g class="net-dot"><circle cx="100" cy="180" r="2.5"/><circle cx="300" cy="300" r="2.5"/><circle cx="520" cy="200" r="2.5"/><circle cx="780" cy="340" r="2.5"/><circle cx="150" cy="920" r="2.5"/><circle cx="380" cy="820" r="2.5"/><circle cx="640" cy="930" r="2.5"/><circle cx="900" cy="820" r="2.5"/></g><g class="net-dot green"><circle cx="1750" cy="180" r="3"/><circle cx="1900" cy="320" r="3"/></g><g class="net-dot pink"><circle cx="1780" cy="940" r="4"/><circle cx="1920" cy="820" r="4"/></g><circle cx="960" cy="80" r="6" fill="#E0A458"/><circle cx="960" cy="80" r="16" stroke="rgba(224,164,88,.3)" stroke-width="1" fill="none"/><text x="990" y="84" font-family="JetBrains Mono" font-size="12" fill="rgba(240,243,247,.6)" letter-spacing="4">// COMPARISON · 横评 · OPEN SOURCE</text></svg><div class="top-bar"><div class="brand-wrap"><div class="brand">$brand</div><div class="brand-sub">$brand_sub</div><div class="brand-mode">$mode</div></div><div class="top-tags"><span class="tg $tag_1_class">$tag_1</span><span class="tg $tag_2_class">$tag_2</span><span class="tg $tag_3_class">$tag_3</span><span class="tg $tag_4_class">$tag_4</span><span class="tg $tag_5_class">$tag_5</span><span class="tg $tag_6_class">$tag_6</span></div></div><div class="left-main"><div class="pre">$pre</div><div class="h1">$h1_l1<br/>$h1_l2<br/><em>$h1_l3_em</em></div><div class="sub">$sub</div><div class="stat-row"><div><div class="stat-n">$stat_1_n</div><div class="stat-l">$stat_1_l</div></div><div><div class="stat-n">$stat_2_n</div><div class="stat-l">$stat_2_l</div></div><div><div class="stat-n">$stat_3_n</div><div class="stat-l">$stat_3_l</div></div></div></div><div class="leaderboard"><div class="lb-title">$lb_title</div><div class="lb-grid">$project_cards</div></div><div class="dim-strip"><div class="dim-title">$dim_title</div><div class="dim-grid">$dim_cards</div></div><div class="bottom-anchor"><div class="ba-left">$pills</div><div class="ba-url">$url</div></div></div></body></html>
